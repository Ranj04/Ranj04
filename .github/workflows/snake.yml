name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # %23 not '#': snk parses these as URLs, so a literal '#' would
          # start the fragment and silently drop every colour parameter.
          outputs: |
            dist/github-snake.svg?color_snake=%232B83F5&color_dots=%23ebedf0,%23c6ddf8,%238fbcf2,%235a9dec,%232B83F5
            dist/github-snake-dark.svg?color_snake=%232B83F5&color_dots=%23161b22,%231d3a5f,%2322518a,%232670c2,%232B83F5

      # snk runs in Docker as root, leaving dist/ unwritable by the runner user.
      - name: Reclaim dist ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate language card
        run: python3 scripts/gen_lang_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: dist/languages.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
