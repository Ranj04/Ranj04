name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2B83F5&color_dots=#ebedf0,#c6ddf8,#8fbcf2,#5a9dec,#2B83F5
            dist/github-snake-dark.svg?color_snake=#2B83F5&color_dots=#161b22,#1d3a5f,#22518a,#2670c2,#2B83F5

      # snk runs in Docker as root, leaving dist/ unwritable by the runner user.
      - name: Reclaim dist ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Generate language card
        run: python3 scripts/gen_lang_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: dist/languages.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
